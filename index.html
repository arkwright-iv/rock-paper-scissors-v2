<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <link rel="stylesheet" href="style.css">
    <title>Rock, Paper, Scissors</title>
  </head>
  <body>
    <h1>Rock, Paper, Scissors</h1>
    <div id="scoreboard">
      <table>
        <thead>
          <tr>
            <th colspan="2">SCOREBOARD</th>
          </tr>
          <tr>
            <th>Player</th>
            <th>Computer</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="player-score">1</td>
            <td class="cpu-score">2</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td class="total-score-text">TOTAL</td>
            <td class="total-score"></td>
          </tr>
        </tfoot>
      </table>
    <div id="container">
      </div>
      <div id="choices-wrapper">
        <img class="rock-btn" src="assets/rock.jpg" alt="A large, horizontal geographical stone.">
        <img class="paper-btn" src="assets/paper.jpg" alt="The texture of crumpled paper.">
        <img class="scissors-btn" src="assets/scissors.jpg" alt="A vintage styled scissors sinked vertically into the soil within a forest.">
      </div>
    </div>
    <div id="results-wrapper">
      <p class="round-result"></p>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
